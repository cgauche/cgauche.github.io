<style>/* Keyframes d'ambiance partagées (portées de public/ambush.html).
   IMPORTANT : chaque classe animée DOIT fixer transform-box:fill-box (sinon le
   pivot se résout contre la view-box du SVG entier → l'anim part au loin / est
   invisible — c'est exactement ce qui faisait que le sang « ne bougeait pas »).
   ambush.html le fait en style inline sur chaque groupe ; ici on le met en CSS. */
.breathe {
  animation: breathe 3s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
.warm {
  animation: flicker 3.6s ease-in-out infinite;
}
.glow {
  animation: glow 2.2s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: center;
}
.sway {
  animation: sway 2.8s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: 50% 0;
}
.smoke {
  animation: smoke 4s linear infinite;
  transform-box: fill-box;
}
@keyframes breathe {
  0%,
  100% {
    transform: scaleY(1);
  }
  50% {
    transform: scaleY(1.035);
  }
}
@keyframes flicker {
  0%,
  100% {
    opacity: 0.85;
  }
  40% {
    opacity: 1;
  }
  65% {
    opacity: 0.7;
  }
}
@keyframes glow {
  0%,
  100% {
    transform: scale(0.8);

/* Anim légère de token entier pour les créatures monolithiques (non riggées). */
@keyframes tok-lunge {
  0% { transform: translateY(0); }
  40% { transform: translate(0, -4px) scale(1.04); }
  100% { transform: translateY(0); }
}
@keyframes tok-recoil {
  0% { transform: translateX(0); }
  30% { transform: translate(4px, 1px) rotate(3deg); }
  100% { transform: translateX(0); }
}
.tok-lunge { animation: tok-lunge 0.3s ease-out; }
.tok-recoil { animation: tok-recoil 0.32s ease-out; }

/* Animations d'ambiance des créatures (portées de public/ambush.html) — appliquées

.feed { animation: feed 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.howl { animation: howl 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }

.wrap { animation: wrap 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 60%; }
@keyframes feed { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(4px) rotate(-2deg); } }
@keyframes howl { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(7deg); } }
@keyframes chop { 0%, 100% { transform: rotate(-14deg); } 55% { transform: rotate(20deg); } }
@keyframes kick { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }

@keyframes wrap { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-2px, 2px); } }

/* Faune d'ambiance (portée d'ambush.html) : mouches qui tournent sur les cadavres,

  25% { transform: translate(0, -7px); }

/* Projectile volant from→to (flèche/carreau ou trait magique). */

  to { transform: translate(var(--bx), var(--by)); }
}
.proj { animation: proj-fly 0.3s linear forwards; }
