<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Comète bicaudée de Sigmar">
  <defs>
    <radialGradient id="vig" cx="64%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#3a2c14"/>
      <stop offset="62%" stop-color="#17121f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="head" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fff4d2"/>
      <stop offset="45%" stop-color="#f2c45a"/>
      <stop offset="100%" stop-color="#b8801f"/>
