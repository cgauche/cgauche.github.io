 cy="2" r="2.6" fill="#4a3525" stroke="#3a2a18" stroke-width="0.6"/><!-- CORDON A (retention / boucle de doigt) : part de la main, ONDULE en S et monte vers la poche. Trace ferme conique (large a la base, fin en haut) = cuir souple, jamais droit. --><path d="M-1 1 C -7 -4 -3 -11 -9 -16 C -14 -20 -12 -27 -16 -33 C -14.5 -33 -13 -30.5 -11.5 -29 C -7.5 -23 -10 -17 -5 -13 C 0 -9 -3 -3 1.6 1.2 Z" fill="#4a3525" stroke="#4a3525" stroke-width="0.55" stroke-linejoin="round"/><!-- reflet fibre cordon A --><path d="M-0.4 0.5 C -5.5 -4 -2.5 -10.5 -8 -15 C -13 -19 -11.5 -26 -15 -31.5" fill="none" stroke="#caa882" stroke-width="0.55" stroke-linecap="round" opacity="0.6"/><!-- CORDON B (release / claquoir) : plus LONG, phase opposee, ondule a droite puis remonte vers la poche, finit par un lambeau libre qui flotte (le cordon qu'on lache). --><path d="M2 1 C 9 -4 5 -12 11 -17 C 16 -21 13 -28 9 -34 C 7.5 -34 8 -30.5 6.5 -28 C 3.5 -22 7 -16 1.5 -12 C -3.5 -8 1.5 -2 -0.4 1.2 Z" fill="#4a3525" stroke="#4a3525" stroke-width="0.55" stroke-linejoin="round"/><!-- reflet fibre cordon B --><path d="M1.4 0.5 C 7.5 -4 3.5 -11.5 9 -16 C 14 -20 11 -27 7.5 -32.5" fill="none" stroke="#caa882" stroke-width="0.55" stroke-linecap="round" opacity="0.6"/><!-- POCHE de cuir swinguee en haut (berceau hamac) qui s'ouvre vers le haut, reliant les deux cordons (de -16,-33 a 9,-34). Berce le galet. --><path d="M-16 -33 C -15 -44 -3 -49 -3.5 -40 C -3.5 -36 1 -36 1 -40 C 0 -49 12 -45 9 -34 C 5 -39 -2 -40 -3.5 -38 C -6 -40 -12 -39 -16 -33 Z" fill="#4a3525" stroke="#4a3525" stroke-width="0.6" stroke-linejoin="round"/><!-- pli/ombre interieure de la poche (relief cuir souple) --><path d="M-12 -36 C -9 -42 5 -42 6 -37" fill="none" stroke="#3a2a18" stroke-width="0.5" opacity="0.55"/><!-- GALET rond berce dans la poche --><circle cx="-3.2" cy="-40.5" r="4.6" fill="#9aa6b8" stroke="#2a3038" stroke-width="0.6"/><ellipse cx="-4.6" cy="-42" rx="1.9" ry="1.2" fill="#cfd8e6" opacity="0.85"/><!-- noeud de doigt (boucle) a  ni curl en tete (=point d'interrogation) : la pointe file tout droit vers le haut. repere os 'arme'. --><!-- pommeau metal cote main (+y) --><circle cx="0" cy="8" r="2.6" fill="#676f80" stroke="#2a3038" stroke-width="0.5"/><!-- COURT manche, cuir tresse (poing -> tete de manche, ~15px) --><rect x="-2.6" y="-7" width="5.2" height="15" rx="2.3" fill="#5a3a1f" stroke="#2e1c0e" stroke-width="0.6"/><g stroke="#321f0e" stroke-width="0.8" opacity="0.9"><line x1="-2.6" y1="-4.5" x2="2.6" y2="-2"/><line x1="-2.6" y1="0" x2="2.6" y2="2.5"/><line x1="-2.6" y1="4.5" x2="2.6" y2="7"/><line x1="2.6" y1="-4.5" x2="-2.6" y2="-2"/><line x1="2.6" y1="0" x2="-2.6" y2="2.5"/><line x1="2.6" y1="4.5" x2="-2.6" y2="7"/></g><!-- virole metal en tete de manche, d'ou jaillit la laniere --><rect x="-2.9" y="-9.5" width="5.8" height="3.2" rx="1.2" fill="#9aa6b8" stroke="#2a3038" stroke-width="0.5"/><!-- LANIERE : ruban ferme conique. ALLER (bord droit, base->pointe) le long du spine en S, puis RETOUR (bord gauche, pointe->base) avec un offset qui retrecit vers 0 a la pointe. Spine : droite, gauche, droite, finit droit vers le haut a (3,-50). --><path d="M2.6 -9 C 10 -14 11 -21 4 -26 C -4 -31 -6 -38 0 -43 C 1.4 -45.3 2.4 -47.6 3 -50 C 2.4 -47.8 1.2 -45.6 -1 -43.4 C -8 -38 -10 -30 -4 -25 C 3 -20 9 -16 -1.4 -9.5 Z" fill="#5a3a1f" stroke="#3a2a1a" stroke-width="0.55" stroke-linejoin="round"/><!-- reflet clair courant le long du spine (relief cuir, suit la fibre) --><path d="M0.8 -10 C 7.5 -15 8 -21 1.4 -25.8 C -5.6 -30.6 -7 -37.6 -1.2 -42.6 C 0 -44.5 1 -46.6 1.8 -48.8" fill="none" stroke="#9a7a4a" stroke-width="0.9" stroke-linecap="round" opacity="0.65"/><!-- mouche / claquoir : fin fil prolongeant la pointe (claquement), reste a la pointe (3,-50) --><path d="M3 -50 q1.8 0.6 2.6 -0.4 M3 -50 q1 -1 1.8 -2.2" fill="none" stroke="#3a2a1a" stroke-width="0.8" stroke-linecap="round"/></g></g></g></g></svg></div><figcaption style="color:#cdd;font:11px sans-serif">fouet</figcaption></figure><figure style=
