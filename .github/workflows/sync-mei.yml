name: Sync Mon Ennemi Intérieur

# Re-fetches the blog (monennemiinterieur.blogspot.com), rebuilds the static
# site, and commits the result under mon-ennemi-interieur/ if anything changed.
#
# Triggers:
#   - workflow_dispatch  → manual button in the Actions tab
#   - schedule           → every 6 hours
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

# Avoid two runs racing on the same push.
concurrency:
  group: sync-mei
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 markdownify

      - name: Refresh blog mirror
        working-directory: .github/scripts
        run: python _blog_sync.py

      - name: Build static site
        working-directory: .github/scripts
        run: python _site_build.py

      - name: Replace mon-ennemi-interieur/ with the fresh build
        run: |
          rm -rf mon-ennemi-interieur
          mkdir mon-ennemi-interieur
          cp -a ".github/scripts/_site/." mon-ennemi-interieur/

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mon-ennemi-interieur ".github/scripts/Mon Ennemi Intérieur Blog"
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "Auto-sync Mon Ennemi Intérieur ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
